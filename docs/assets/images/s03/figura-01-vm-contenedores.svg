</style>
<text x="90" y="85" class="title" text-anchor="start">Máquinas virtuales y contenedores</text><text x="90" y="125" class="subtitle" text-anchor="start">El aislamiento ocurre en niveles distintos de la pila de ejecución</text><line x1="90" y1="150" x2="1510" y2="150" stroke="#C79A3B" stroke-width="4"/><rect x="80" y="195" width="690" height="625" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="830" y="195" width="690" height="625" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="425" y="240" class="h" text-anchor="middle">Máquinas virtuales</text><text x="1175" y="240" class="h" text-anchor="middle">Contenedores Linux</text><rect x="150" y="285" width="250" height="90" rx="14" fill="#EAF2F8" stroke="#1F5A85" stroke-width="2"/><text x="275" y="325" class="t" text-anchor="middle" font-size="20px">Aplicación + dependencias</text><text x="275" y="355" class="s" text-anchor="middle">VM A</text><rect x="150" y="385" width="250" height="100" rx="14" fill="#F7EEDB" stroke="#C79A3B" stroke-width="2"/><text x="275" y="425" class="t" text-anchor="middle">Sistema operativo invitado</text><text x="275" y="458" class="s" text-anchor="middle">kernel propio</text><rect x="450" y="285" width="250" height="90" rx="14" fill="#EAF2F8" stroke="#1F5A85" stroke-width="2"/><text x="575" y="325" class="t" text-anchor="middle" font-size="20px">Aplicación + dependencias</text><text x="575" y="355" class="s" text-anchor="middle">VM B</text><rect x="450" y="385" width="250" height="100" rx="14" fill="#F7EEDB" stroke="#C79A3B" stroke-width="2"/><text x="575" y="425" class="t" text-anchor="middle">Sistema operativo invitado</text><text x="575" y="458" class="s" text-anchor="middle">kernel propio</text><rect x="150" y="520" width="550" height="90" rx="14" fill="#EEF1F4" stroke="#CBD5E1" stroke-width="2"/><text x="425" y="562" class="h" text-anchor="middle">Hipervisor</text><rect x="150" y="650" width="550" height="90" rx="14" fill="#E8EDF2" stroke="#CBD5E1" stroke-width="2"/><text x="425" y="704" class="h" text-anchor="middle">Hardware físico</text><rect x="900" y="285" width="250" height="110" rx="14" fill="#EAF2F8" stroke="#1F5A85" stroke-width="2"/><text x="1025" y="325" class="t" text-anchor="middle" font-size="20px">Aplicación + dependencias</text><text x="1025" y="362" class="s" text-anchor="middle">Contenedor A</text><rect x="1200" y="285" width="250" height="110" rx="14" fill="#EAF2F8" stroke="#1F5A85" stroke-width="2"/><text x="1325" y="325" class="t" text-anchor="middle" font-size="20px">Aplicación + dependencias</text><text x="1325" y="362" class="s" text-anchor="middle">Contenedor B</text><rect x="900" y="430" width="550" height="85" rx="14" fill="#EEF1F4" stroke="#CBD5E1" stroke-width="2"/><text x="1175" y="482" class="h" text-anchor="middle">Runtime / motor de contenedores</text><rect x="900" y="545" width="550" height="90" rx="14" fill="#F7EEDB" stroke="#C79A3B" stroke-width="2"/><text x="1175" y="585" class="h" text-anchor="middle">Kernel Linux compartido</text><text x="1175" y="617" class="s" text-anchor="middle">namespaces, cgroups y mecanismos del kernel</text><rect x="900" y="675" width="550" height="65" rx="14" fill="#E8EDF2" stroke="#CBD5E1" stroke-width="2"/><text x="1175" y="717" class="h" text-anchor="middle">Hardware físico</text><text x="1175" y="790" class="s" text-anchor="middle">En Docker Desktop, este kernel puede pertenecer a un entorno Linux virtualizado.</text></svg>