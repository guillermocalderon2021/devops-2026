<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Contexto de construcción</title><desc id="desc">El contexto define las entradas accesibles al build. BuildKit usa únicamente las entradas necesarias según el grafo de construcción.</desc>
<rect width="1600" height="900" fill="#F7F9FB"/>
<style>
  text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill:#1F2933; }
  .title { font-size:42px; font-weight:700; fill:#123B5D; }
  .subtitle { font-size:22px; fill:#64748B; }
  .h { font-size:26px; font-weight:700; }
  .t { font-size:22px; }
  .s { font-size:18px; fill:#64748B; }
  .mono { font-family: Consolas, 'Courier New', monospace; font-size:20px; }
</style>
<text x="90" y="85" class="title" text-anchor="start">Contexto de construcción</text><text x="90" y="125" class="subtitle" text-anchor="start">El contexto delimita qué archivos puede utilizar el builder</text><line x1="90" y1="150" x2="1510" y2="150" stroke="#C79A3B" stroke-width="4"/><rect x="90" y="215" width="470" height="520" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="130" y="260" class="h" text-anchor="start">Repositorio local</text><text x="160" y="310" class="mono" text-anchor="start" fill="#1F5A85">Dockerfile</text><text x="160" y="368" class="mono" text-anchor="start" fill="#1F2933">requirements.txt</text><text x="160" y="426" class="mono" text-anchor="start" fill="#1F2933">app.py</text><text x="160" y="484" class="mono" text-anchor="start" fill="#1F2933">tests/</text><text x="160" y="542" class="mono" text-anchor="start" fill="#64748B">.git/</text><text x="160" y="600" class="mono" text-anchor="start" fill="#64748B">.venv/</text><text x="130" y="690" class="mono" text-anchor="start" fill="#123B5D">docker build .</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5A85"/></marker></defs><line x1="575" y1="475" x2="725" y2="475" stroke="#1F5A85" stroke-width="4" marker-end="url(#arr)"/><rect x="735" y="275" width="380" height="395" rx="20" fill="#FFFFFF" stroke="#1F5A85" stroke-width="3"/><text x="925" y="325" class="h" text-anchor="middle">Contexto de construcción</text><text x="925" y="372" class="t" text-anchor="middle">Frontera de entradas</text><text x="925" y="405" class="t" text-anchor="middle">disponibles para el build</text><line x1="790" y1="440" x2="1060" y2="440" stroke="#CBD5E1" stroke-width="2"/><text x="925" y="490" class="mono" text-anchor="middle">COPY / ADD</text><text x="925" y="535" class="s" text-anchor="middle">bind mounts de build</text><text x="925" y="580" class="s" text-anchor="middle">otras entradas declaradas</text><text x="925" y="625" class="t" text-anchor="middle" fill="#C79A3B">≠ contenido final de la imagen</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5A85"/></marker></defs><line x1="1125" y1="475" x2="1260" y2="475" stroke="#1F5A85" stroke-width="4" marker-end="url(#arr)"/><rect x="1270" y="350" width="250" height="250" rx="20" fill="#F4E9CF" stroke="#C79A3B" stroke-width="3"/><text x="1395" y="410" class="h" text-anchor="middle">BuildKit</text><text x="1395" y="455" class="t" text-anchor="middle">resuelve el grafo</text><text x="1395" y="492" class="t" text-anchor="middle">de construcción</text><text x="1395" y="548" class="s" text-anchor="middle">y reutiliza caché</text><text x="800" y="790" class="s" text-anchor="middle">BuildKit puede evitar transferir entradas no utilizadas y transferir incrementalmente archivos modificados.</text></svg>