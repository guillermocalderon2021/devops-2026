<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Imagen y contenedores</title><desc id="desc">Una imagen de solo lectura puede originar múltiples contenedores, cada uno con su propia capa escribible.</desc>
<rect width="1600" height="900" fill="#F7F9FB"/>
<style>
  text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill:#1F2933; }
  .title { font-size:42px; font-weight:700; fill:#123B5D; }
  .subtitle { font-size:22px; fill:#64748B; }
  .h { font-size:26px; font-weight:700; }
  .t { font-size:22px; }
  .s { font-size:18px; fill:#64748B; }
  .mono { font-family: Consolas, 'Courier New', monospace; font-size:20px; }
</style>
<text x="90" y="85" class="title" text-anchor="start">Imagen y contenedores</text><text x="90" y="125" class="subtitle" text-anchor="start">La imagen se comparte; el estado escribible pertenece a cada contenedor</text><line x1="90" y1="150" x2="1510" y2="150" stroke="#C79A3B" stroke-width="4"/><text x="390" y="220" class="h" text-anchor="middle">Imagen</text><rect x="190" y="260" width="400" height="90" rx="10" fill="#DDEBF5" stroke="#CBD5E1" stroke-width="2"/><text x="390" y="315" class="t" text-anchor="middle">Código de la aplicación</text><rect x="190" y="352" width="400" height="90" rx="10" fill="#E7F0F7" stroke="#CBD5E1" stroke-width="2"/><text x="390" y="407" class="t" text-anchor="middle">Dependencias de aplicación</text><rect x="190" y="444" width="400" height="90" rx="10" fill="#F4E9CF" stroke="#CBD5E1" stroke-width="2"/><text x="390" y="499" class="t" text-anchor="middle">Runtime y bibliotecas</text><rect x="190" y="536" width="400" height="90" rx="10" fill="#EEF1F4" stroke="#CBD5E1" stroke-width="2"/><text x="390" y="591" class="t" text-anchor="middle">Imagen base</text><text x="390" y="650" class="s" text-anchor="middle">Capas de solo lectura</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5A85"/></marker></defs><line x1="610" y1="445" x2="740" y2="445" stroke="#1F5A85" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5A85"/></marker></defs><line x1="610" y1="445" x2="1020" y2="445" stroke="#1F5A85" stroke-width="3" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5A85"/></marker></defs><line x1="610" y1="445" x2="1300" y2="445" stroke="#1F5A85" stroke-width="3" marker-end="url(#arr)"/><text x="840" y="250" class="h" text-anchor="middle">Contenedor A</text><rect x="725" y="285" width="230" height="90" rx="10" fill="#FFF1DB" stroke="#C79A3B" stroke-width="2"/><text x="840" y="325" class="t" text-anchor="middle">Capa escribible</text><text x="840" y="354" class="s" text-anchor="middle">propia</text><rect x="725" y="390" width="230" height="200" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="840" y="430" class="t" text-anchor="middle">Capas de la imagen</text><line x1="760" y1="455" x2="920" y2="455" stroke="#CBD5E1" stroke-width="2"/><text x="840" y="490" class="s" text-anchor="middle">compartidas</text><text x="840" y="530" class="s" text-anchor="middle">solo lectura</text><text x="1120" y="250" class="h" text-anchor="middle">Contenedor B</text><rect x="1005" y="285" width="230" height="90" rx="10" fill="#FFF1DB" stroke="#C79A3B" stroke-width="2"/><text x="1120" y="325" class="t" text-anchor="middle">Capa escribible</text><text x="1120" y="354" class="s" text-anchor="middle">propia</text><rect x="1005" y="390" width="230" height="200" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="1120" y="430" class="t" text-anchor="middle">Capas de la imagen</text><line x1="1040" y1="455" x2="1200" y2="455" stroke="#CBD5E1" stroke-width="2"/><text x="1120" y="490" class="s" text-anchor="middle">compartidas</text><text x="1120" y="530" class="s" text-anchor="middle">solo lectura</text><text x="1400" y="250" class="h" text-anchor="middle">Contenedor C</text><rect x="1285" y="285" width="230" height="90" rx="10" fill="#FFF1DB" stroke="#C79A3B" stroke-width="2"/><text x="1400" y="325" class="t" text-anchor="middle">Capa escribible</text><text x="1400" y="354" class="s" text-anchor="middle">propia</text><rect x="1285" y="390" width="230" height="200" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="1400" y="430" class="t" text-anchor="middle">Capas de la imagen</text><line x1="1320" y1="455" x2="1480" y2="455" stroke="#CBD5E1" stroke-width="2"/><text x="1400" y="490" class="s" text-anchor="middle">compartidas</text><text x="1400" y="530" class="s" text-anchor="middle">solo lectura</text><rect x="720" y="690" width="750" height="90" rx="14" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="1095" y="730" class="t" text-anchor="middle">Eliminar un contenedor no modifica la imagen ni los demás contenedores.</text><text x="1095" y="762" class="s" text-anchor="middle">Los datos persistentes requieren mecanismos de almacenamiento separados.</text></svg>