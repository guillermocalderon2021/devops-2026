<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Invalidación de caché</title><desc id="desc">Comparación de dos Dockerfiles: copiar todo el proyecto antes de instalar dependencias frente a separar dependencias de código.</desc>
<rect width="1600" height="900" fill="#F7F9FB"/>
<style>
  text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill:#1F2933; }
  .title { font-size:42px; font-weight:700; fill:#123B5D; }
  .subtitle { font-size:22px; fill:#64748B; }
  .h { font-size:26px; font-weight:700; }
  .t { font-size:22px; }
  .s { font-size:18px; fill:#64748B; }
  .mono { font-family: Consolas, 'Courier New', monospace; font-size:20px; }
</style>
<text x="90" y="85" class="title" text-anchor="start">Orden de instrucciones y reutilización de caché</text><text x="90" y="125" class="subtitle" text-anchor="start">Un cambio frecuente debe invalidar la menor cantidad posible de trabajo costoso</text><line x1="90" y1="150" x2="1510" y2="150" stroke="#C79A3B" stroke-width="4"/><rect x="80" y="200" width="700" height="610" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="820" y="200" width="700" height="610" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="430" y="245" class="h" text-anchor="middle">Versión A</text><text x="1170" y="245" class="h" text-anchor="middle">Versión B</text><rect x="150" y="290" width="560" height="75" rx="10" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="185" y="322" class="mono" text-anchor="start">FROM python:3.12-slim</text><text x="675" y="321" class="s" text-anchor="end" fill="#2F7D5B">CACHE</text><line x1="430" y1="365" x2="430" y2="385" stroke="#CBD5E1" stroke-width="3"/><rect x="150" y="390" width="560" height="75" rx="10" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="185" y="422" class="mono" text-anchor="start">WORKDIR /app</text><text x="675" y="421" class="s" text-anchor="end" fill="#2F7D5B">CACHE</text><line x1="430" y1="465" x2="430" y2="485" stroke="#CBD5E1" stroke-width="3"/><rect x="150" y="490" width="560" height="75" rx="10" fill="#FFF3E6" stroke="#B76A1F" stroke-width="2"/><text x="185" y="522" class="mono" text-anchor="start">COPY . .</text><text x="675" y="521" class="s" text-anchor="end" fill="#B76A1F">CAMBIA app.py</text><line x1="430" y1="565" x2="430" y2="585" stroke="#CBD5E1" stroke-width="3"/><rect x="150" y="590" width="560" height="75" rx="10" fill="#FCEEEE" stroke="#A64545" stroke-width="2"/><text x="185" y="622" class="mono" text-anchor="start">RUN pip install ...</text><text x="675" y="621" class="s" text-anchor="end" fill="#A64545">REBUILD</text><line x1="430" y1="665" x2="430" y2="685" stroke="#CBD5E1" stroke-width="3"/><rect x="150" y="690" width="560" height="75" rx="10" fill="#FCEEEE" stroke="#A64545" stroke-width="2"/><text x="185" y="722" class="mono" text-anchor="start">CMD [...]</text><text x="675" y="721" class="s" text-anchor="end" fill="#A64545">REBUILD</text><rect x="890" y="285" width="560" height="67" rx="10" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="920" y="314" class="mono" text-anchor="start">FROM python:3.12-slim</text><text x="1415" y="313" class="s" text-anchor="end" fill="#2F7D5B">CACHE</text><line x1="1170" y1="352" x2="1170" y2="367" stroke="#CBD5E1" stroke-width="3"/><rect x="890" y="367" width="560" height="67" rx="10" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="920" y="396" class="mono" text-anchor="start">WORKDIR /app</text><text x="1415" y="395" class="s" text-anchor="end" fill="#2F7D5B">CACHE</text><line x1="1170" y1="434" x2="1170" y2="449" stroke="#CBD5E1" stroke-width="3"/><rect x="890" y="449" width="560" height="67" rx="10" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="920" y="478" class="mono" text-anchor="start">COPY requirements.txt .</text><text x="1415" y="477" class="s" text-anchor="end" fill="#2F7D5B">CACHE</text><line x1="1170" y1="516" x2="1170" y2="531" stroke="#CBD5E1" stroke-width="3"/><rect x="890" y="531" width="560" height="67" rx="10" fill="#EAF5F0" stroke="#2F7D5B" stroke-width="2"/><text x="920" y="560" class="mono" text-anchor="start">RUN pip install ...</text><text x="1415" y="559" class="s" text-anchor="end" fill="#2F7D5B">CACHE</text><line x1="1170" y1="598" x2="1170" y2="613" stroke="#CBD5E1" stroke-width="3"/><rect x="890" y="613" width="560" height="67" rx="10" fill="#FFF3E6" stroke="#B76A1F" stroke-width="2"/><text x="920" y="642" class="mono" text-anchor="start">COPY . .</text><text x="1415" y="641" class="s" text-anchor="end" fill="#B76A1F">CAMBIA app.py</text><line x1="1170" y1="680" x2="1170" y2="695" stroke="#CBD5E1" stroke-width="3"/><rect x="890" y="695" width="560" height="67" rx="10" fill="#FCEEEE" stroke="#A64545" stroke-width="2"/><text x="920" y="724" class="mono" text-anchor="start">CMD [...]</text><text x="1415" y="723" class="s" text-anchor="end" fill="#A64545">REBUILD</text><text x="430" y="792" class="s" text-anchor="middle" fill="#A64545">Cambiar código obliga a reinstalar dependencias.</text><text x="1170" y="792" class="s" text-anchor="middle" fill="#2F7D5B">Cambiar código conserva la instalación de dependencias en caché.</text></svg>